  <div id="lockScreen" class="lock-screen"></div>
  <div id="appShell" class="hidden">
    <aside class="sidebar">
      <div class="brand" aria-label="سوبرماركت الكينج">

          <g fill="none" stroke="#D9A920" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 20 34 31 48 16 59 31 76 15 82 32 92 24 87 43H31z"/><path d="M36 39h49l-5 8H39z"/><path d="M40 51h38l-4 28H45z"/><path d="M48 58v13m10-13v13m10-13v13"/><path d="M32 43 23 37H15"/><circle cx="50" cy="88" r="4"/><circle cx="71" cy="88" r="4"/></g>
        </svg>
        <div class="brand-copy"><small>سوبرماركت</small><strong>الكينج</strong></div>
      </div>
      <div class="side-caption">إدارة المحل</div>
      <nav class="nav-list" id="sideNav"></nav>
      <div class="side-bottom"><strong>الكينج</strong> · نظام داخلي للمبيعات والحسابات<br>جميع الأرصدة محسوبة من الحركات</div>
    </aside>

    const round2 = n => Math.round((Number(n)||0)*100)/100;

    const todayKey = (date=new Date()) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const localInputDate = (date=new Date()) => { const d=new Date(date.getTime()-date.getTimezoneOffset()*60000); return d.toISOString().slice(0,16); };
    const toISO = value => { if(!value)return nowISO(); const d=new Date(value); return Number.isNaN(d.getTime())?nowISO():d.toISOString(); };
    const dateKey = value => { const d=new Date(value); return Number.isNaN(d.getTime())?'':todayKey(d); };
    const dateText = (value, withTime=false) => { if(!value)return '—'; const d=new Date(value); if(Number.isNaN(d.getTime()))return '—'; return new Intl.DateTimeFormat('ar-EG',{year:'numeric',month:'short',day:'numeric',...(withTime?{hour:'2-digit',minute:'2-digit'}:{})}).format(d); };
    const money = n => `${new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(round2(n))} ج.م`;
    const numberText = n => new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(Number(n)||0);
    const esc = value => String(value??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function randomSalt(){
      const bytes=new Uint8Array(16);
      if(window.crypto&&crypto.getRandomValues) crypto.getRandomValues(bytes); else for(let i=0;i<bytes.length;i++)bytes[i]=Math.floor(Math.random()*256);
      return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
    }
    function sha256Fallback(text){
      const primes=[];for(let n=2;primes.length<64;n++){let p=true;for(let d=2;d*d<=n;d++)if(n%d===0){p=false;break}if(p)primes.push(n)}
      const K=primes.map(p=>Math.floor((Math.cbrt(p)%1)*4294967296)>>>0);
      const H=primes.slice(0,8).map(p=>Math.floor((Math.sqrt(p)%1)*4294967296)>>>0);
      const bytes=Array.from(new TextEncoder().encode(text));const bitLen=bytes.length*8;bytes.push(128);while(bytes.length%64!==56)bytes.push(0);
      for(let i=7;i>=0;i--)bytes.push(i<4?(bitLen>>>(i*8))&255:0);
      const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
      for(let offset=0;offset<bytes.length;offset+=64){
        const w=new Uint32Array(64);
        for(let i=0;i<16;i++)w[i]=((bytes[offset+i*4]<<24)|(bytes[offset+i*4+1]<<16)|(bytes[offset+i*4+2]<<8)|bytes[offset+i*4+3])>>>0;
        for(let i=16;i<64;i++){const a=rotr(w[i-15],7)^rotr(w[i-15],18)^(w[i-15]>>>3);const b=rotr(w[i-2],17)^rotr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+a+w[i-7]+b)>>>0}
        let [a,b,c,d,e,f,g,h]=H;
        for(let i=0;i<64;i++){const s1=rotr(e,6)^rotr(e,11)^rotr(e,25),ch=(e&f)^(~e&g),t1=(h+s1+ch+K[i]+w[i])>>>0;const s0=rotr(a,2)^rotr(a,13)^rotr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
        H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0;
      }
      return H.map(x=>x.toString(16).padStart(8,'0')).join('');
    }
    async function sha256(text){
      try{if(window.crypto&&crypto.subtle){const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
      return sha256Fallback(text);
    }

    function freshState(){

        items:[],customers:[],suppliers:[],invoices:[],purchases:[],payments:[],customerEntries:[],supplierEntries:[],saleReturns:[],purchaseReturns:[],stockMoves:[],accountMoves:[],expenses:[],checks:[],partners:[{id:'partner_quarter',name:'الربع',phone:'',share:50},{id:'partner_dosouki',name:'الدسوقي',phone:'',share:50}],partnerEntries:[],distributions:[],audit:[],closings:[],recurring:[],meta:{openingRecorded:false,lastBackupAt:null,nextSale:1,nextPurchase:1}};
    }
    function storageRead(){
      try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const parsed=JSON.parse(raw);if(!parsed||typeof parsed!=='object')return null;return parsed}catch(error){console.error('تعذر قراءة البيانات المحلية',error);setTimeout(()=>toast('تعذر قراءة البيانات المحفوظة. قد تكون البيانات تالفة.'),50);return null}
    }
    function storageWrite(){
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));checkStorageSize();return true}catch(error){console.error('تعذر حفظ البيانات المحلية',error);toast('تعذر الحفظ. مساحة التخزين قد تكون ممتلئة. صدّر نسخة احتياطية.');return false}
    }
    function checkStorageSize(){try{const raw=localStorage.getItem(STORAGE_KEY)||'';if(raw.length>3_500_000&&!window.storageWarningShown){window.storageWarningShown=true;toast('تنبيه: مساحة التخزين المحلية تقترب من الحد المتاح. صدّر نسخة احتياطية واحذف صوراً كبيرة إن وجدت.')}}catch(error){console.warn(error)}}
    function ensureStateShape(){
      const defaults=freshState();for(const key of Object.keys(defaults))if(state[key]===undefined)state[key]=defaults[key];

      if(!state.partners.length)state.partners=defaults.partners;
    }
    async function initialize(){
      state=storageRead()||freshState();ensureStateShape();
      if(!state.auth.salt||!state.auth.hash){state.auth.salt=randomSalt();state.auth.hash=await sha256(`${state.auth.salt}:1111`);state.auth.isDefault=true;storageWrite()}

    function toast(message,withUndo=false){

    }
    function addAudit(action){state.audit.push({id:makeId('audit'),action,actor:activeActor(),at:nowISO()})}

        addAudit(label);storageWrite();if(undo)undoState={snapshot:before,label};

    function renderLock(message=''){

    }

    async function handleLogin(form){
      const password=new FormData(form).get('password')||'';const now=Date.now();
      if(now<Number(state.auth.lockUntil||0)){renderLock();return}
      const digest=await sha256(`${state.auth.salt}:${password}`);
      if(digest!==state.auth.hash){state.auth.wrongAttempts=(Number(state.auth.wrongAttempts)||0)+1;if(state.auth.wrongAttempts>=5){state.auth.lockUntil=Date.now()+60000;state.auth.wrongAttempts=0;storageWrite();renderLock('تم إيقاف الدخول دقيقة بعد 5 محاولات خاطئة.');return}storageWrite();renderLock(`كلمة المرور غير صحيحة. المحاولة ${state.auth.wrongAttempts} من 5.`);return}
      state.auth.wrongAttempts=0;state.auth.lockUntil=0;storageWrite();session.unlocked=true;session.lastActivity=Date.now();
      if(state.auth.isDefault)toast('غيّر الباسورد الافتراضي من الإعدادات لحماية النظام');
      startIdleTimer();openStaffPicker();
    }

      if(session.staff&&$('#staffSelect'))$('#staffSelect').value=session.staff;
    }

    let idleTimer=null;
    function startIdleTimer(){if(idleTimer)clearInterval(idleTimer);idleTimer=setInterval(()=>{if(session.unlocked&&Date.now()-session.lastActivity>Math.max(1,Number(state.settings.idleMinutes)||15)*60000){lockSystem();toast('تم قفل النظام تلقائياً بسبب عدم النشاط')}},15000)}

      const next=setupStep<2?'<button class="btn btn-primary" type="button" data-act="setup-next">التالي</button>':'<button class="btn btn-primary" type="button" data-act="setup-finish">إنهاء التجهيز</button>';

    function renderPage(page){

    function getInvoicesToday(type){const list=type==='sale'?state.invoices:state.purchases;return list.filter(v=>!v.cancelled&&dateKey(v.date)===todayKey())}
    function cashBalance(account='cash',until=null){return round2(state.accountMoves.filter(m=>m.account===account&&(!until||m.date<=until)).reduce((sum,m)=>sum+Number(m.amount||0),0))}
    function partnerBalance(partnerId){return round2(state.partnerEntries.filter(e=>e.partnerId===partnerId).reduce((sum,e)=>sum+Number(e.amount||0),0))}
    function customerBalance(id){return round2(state.customerEntries.filter(e=>e.customerId===id).reduce((sum,e)=>sum+Number(e.delta||0),0))}
    function supplierBalance(id){return round2(state.supplierEntries.filter(e=>e.supplierId===id).reduce((sum,e)=>sum+Number(e.delta||0),0))}

    function itemById(id){return state.items.find(i=>i.id===id)}

    }

    function salesChartSvg(){

    function dashboardAlerts(){

    function invoiceName(type,invoice){return type==='sale'?(customerById(invoice.customerId)?.name||'عميل نقدي'):(supplierById(invoice.supplierId)?.name||'مورد نقدي')}
    function renderInvoices(type){

      return `${heading(title,isSale?'تسجيل البيع يحدث المخزون والعميل والخزنة تلقائياً.':'تسجيل الشراء يحدث المخزون والمورد والحسابات تلقائياً.',`<button class="btn btn-primary" data-act="${action}">${icon('plus',17)} فاتورة ${isSale?'بيع':'شراء'}</button>`)}<div class="toolbar"><div class="search-box"><input class="control list-search" placeholder="ابحث برقم الفاتورة أو الاسم"></div><div class="toolbar-right"><button class="btn btn-soft" data-act="${isSale?'customer-payment':'supplier-payment'}">${isSale?'قبض من عميل':'دفع لمورد'}</button></div></div>${list.length?`<div class="table-wrap"><table class="data-table"><thead><tr><th>رقم</th><th>${isSale?'العميل':'المورد'}</th><th>التاريخ والوقت</th><th>الإجمالي</th><th>مدفوع</th><th>المسجّل</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${rows}</tbody></table></div><div class="mobile-list">${cards}</div>`:emptyState(`مفيش فواتير ${isSale?'مبيعات':'مشتريات'} لسه`,`ابدأ بتسجيل أول فاتورة ${isSale?'بيع':'شراء'}.`,`<button class="btn btn-primary btn-small" data-act="${action}">فاتورة جديدة</button>`)}`;

    function inRange(value,from,to){const key=dateKey(value);return (!from||key>=from)&&(!to||key<=to)}
    function profitMetrics(from,to,actor=''){
      const saleList=state.invoices.filter(i=>!i.cancelled&&inRange(i.date,from,to)&&(!actor||i.actor===actor));
      const returnList=state.saleReturns.filter(r=>inRange(r.date,from,to)&&(!actor||r.actor===actor));
      const sales=round2(saleList.reduce((s,i)=>s+i.total,0)-returnList.reduce((s,r)=>s+r.total,0));
      const cost=round2(saleList.reduce((s,i)=>s+Number(i.costTotal||0),0)-returnList.reduce((s,r)=>s+Number(r.cost||0),0));
      const purchaseList=state.purchases.filter(i=>!i.cancelled&&inRange(i.date,from,to)&&(!actor||i.actor===actor));
      const purchaseReturns=state.purchaseReturns.filter(r=>inRange(r.date,from,to)&&(!actor||r.actor===actor));

      for(const inv of candidates){if(remaining<=0)break;const open=getInvoiceOpen(inv,type);if(open<=0)continue;const used=round2(Math.min(open,remaining));allocations.push({invoiceId:inv.id,amount:used});remaining=round2(remaining-used)}

        if(status==='collected'){addAccountMove('bank',check.direction==='in'?check.amount:-check.amount,'check-clearing',`${check.direction==='in'?'تحصيل شيك وارد':'صرف شيك صادر'} ${check.number||''}`,nowISO(),check.partyName,check.id,{checkId:check.id});check.status='collected';check.collectedAt=nowISO()}
        else if(status==='bounced'){
          if(check.status==='collected'){const move=[...state.accountMoves].reverse().find(m=>m.ref===check.id&&m.type==='check-clearing');if(move)addAccountMove('bank',-move.amount,'check-bounce-reversal',`عكس شيك مرتد ${check.number||''}`,nowISO(),check.partyName,check.id,{checkId:check.id})}
          if(payment&&!payment.reversed){if(payment.partyId)addPartyEntry(payment.kind,payment.partyId,payment.amount,'check-bounce',`عكس دفعة شيك مرتد ${check.number||''}`,nowISO(),check.id);payment.reversed=true;payment.allocations=[]}
          check.status='bounced';check.bouncedAt=nowISO();
        }
      });
    }

    function parseCSV(text){
      const rows=[];let row=[],cell='',quoted=false;const input=String(text||'').replace(/^\uFEFF/,'');for(let i=0;i<input.length;i++){const ch=input[i];if(ch==='"'){if(quoted&&input[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&input[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;
    }
    function importCSV(type,text){
      const rows=parseCSV(text);if(!rows.length)return toast('ملف CSV فارغ');const normalize=s=>String(s||'').trim().toLowerCase();const first=rows[0].map(normalize);const hasHeader=first.some(v=>['name','الاسم','اسم الصنف','اسم العميل','category','القسم'].includes(v));const headers=hasHeader?first:[];const dataRows=hasHeader?rows.slice(1):rows;const get=(row,names,index,def='')=>{const ix=headers.length?headers.findIndex(h=>names.includes(h)):-1;return ix>=0?row[ix]??def:row[index]??def};let count=0;
      try{commit(`استيراد ${type==='items'?'أصناف':'عملاء'} CSV`,()=>{for(const row of dataRows){if(type==='items'){const name=String(get(row,['name','الاسم','اسم الصنف'],0)).trim();if(!name)continue;const item={id:makeId('item'),name,category:String(get(row,['category','القسم'],1)).trim(),unit:String(get(row,['unit','الوحدة'],2,'قطعة')).trim()||'قطعة',unit2Name:'',unit2Factor:0,buyPrice:Number(get(row,['cost','buyprice','سعر الشراء'],3,0))||0,retailPrice:Number(get(row,['price','retailprice','سعر البيع'],4,0))||0,wholesalePrice:0,alertThreshold:Number(state.settings.alertThreshold)||5,barcode:String(get(row,['barcode','باركود'],5)).trim(),expiry:'',createdAt:nowISO()};const qty=Number(get(row,['stock','quantity','الكمية'],6,0))||0;state.items.push(item);if(qty>0)addStockMove(item.id,qty,'opening','استيراد CSV',nowISO(),'',{imported:true});count++}else{const name=String(get(row,['name','الاسم','اسم العميل'],0)).trim();if(!name)continue;const c={id:makeId('customer'),name,phone:String(get(row,['phone','التليفون','الهاتف'],1)).trim(),address:String(get(row,['address','العنوان'],2)).trim(),notes:'',dueDate:'',creditLimit:Number(get(row,['creditlimit','حد الائتمان'],5,0))||0,createdAt:nowISO()};state.customers.push(c);const opening=Number(get(row,['opening','balance','الرصيد السابق','مبلغ سابق عليه'],3,0))||0;if(opening>0)addPartyEntry('customer',c.id,opening,'opening','رصيد مستورد من CSV',nowISO(),'',{imported:true});count++}}});toast(`تم استيراد ${count} سجل`)}catch(error){toast(error.message||'تعذر استيراد CSV')}
    }
    function downloadFile(name,content,mime='text/csv;charset=utf-8'){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
